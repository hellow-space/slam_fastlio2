只改批准的机制，不顺带改输入、时钟/时间戳、TF、QoS、线程、过滤、精度阈值、诊断开关、评估器或输出指标。不得通过改header、丢旧帧或降低精度冒充延迟提升；已有TF/Path修复不重复实施。
输出：实际任务名、精确文件/diff、授权范围与假设对应、允许的构建/小检查结果与准确命令、失败日志、回退和未解决风险。未运行的步骤明确写未执行，不声称性能或精度改善。涉及时间同步/TF必须说明树和时间戳语义影响。
只执行主控明确允许的验证；本轮框架配置任务不编译、不跑包测试/benchmark、不启动ROS或操作机器人。不派生Agent，不擅自提交Git、改变依赖或扩大重构。实现完成交回主控，再由experimenter验收。
